    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "redis (>=7.2.0,<8.0.0)",
    "celery (>=5.6.2,<6.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "bcrypt (==4.0.1)",
    "pyotp (>=2.9.0,<3.0.0) ; python_version >= \"3.11\" and python_full_version < \"4.0.0\"",
